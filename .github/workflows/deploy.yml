name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api:
    name: Build & deploy API (App Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: dotnet publish backend/src/LimsControlLab.Api/LimsControlLab.Api.csproj -c Release -o publish

      - name: Deploy to Azure App Service (API)
        uses: azure/webapps-deploy@v3
        with:
          app-name: lims-controllab-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

  web:
    name: Build & deploy frontend (App Service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build Angular (production)
        run: npx ng build --configuration production
        working-directory: frontend

      # The web App Service serves the static build via `pm2 serve /home/site/wwwroot --spa`,
      # so we deploy the built browser output as the package (lands in wwwroot).
      - name: Deploy to Azure App Service (Web)
        uses: azure/webapps-deploy@v3
        with:
          app-name: lims-controllab-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_WEB_PUBLISH_PROFILE }}
          package: frontend/dist/frontend/browser
