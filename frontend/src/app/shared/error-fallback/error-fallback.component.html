<div class="flex min-h-screen items-center justify-center bg-background px-4 py-8">
  <z-card class="w-full max-w-sm">
    <z-card-content class="space-y-6">
      <!-- Icon -->
      <div class="flex justify-center">
        <div class="rounded-full bg-destructive/12 p-4">
          <ng-icon name="lucideTriangleAlert" class="h-8 w-8 text-destructive" />
        </div>
      </div>

      <!-- Content -->
      <div class="space-y-2 text-center">
        <h1 class="text-2xl font-semibold tracking-tight">Oops! Something went wrong</h1>
        <p class="text-sm text-muted-foreground">
          We encountered an unexpected error. Please try again or return to the work queue.
        </p>
      </div>

      <!-- Button -->
      <button z-button (click)="goHome()" class="w-full">
        Return to Work Queue
      </button>
    </z-card-content>
  </z-card>
</div>
