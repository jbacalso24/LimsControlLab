<div class="flex h-screen overflow-hidden bg-background text-foreground">
  <!-- Left Sidebar -->
  <aside
    class="fixed left-0 top-0 z-30 flex h-screen w-60 flex-col border-r border-sidebar-border bg-sidebar text-sidebar-foreground transition-[width,transform] duration-200 lg:relative lg:translate-x-0"
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
    [ngClass]="{ 'lg:w-16': collapsed() }"
  >
    <!-- Brand -->
    <div
      class="flex h-14 shrink-0 items-center gap-2.5 border-b border-sidebar-border px-4"
      [ngClass]="{ 'lg:justify-center': collapsed(), 'lg:px-0': collapsed() }"
    >
      <img
        src="/branding/wilmar-logo.png"
        alt="Wilmar Sugar Australia"
        class="h-5 w-auto shrink-0 brightness-0 dark:brightness-100"
      />
      <span
        class="whitespace-nowrap text-sm font-semibold leading-tight"
        [ngClass]="{ 'lg:hidden': collapsed() }"
        >LIMS Control Lab</span
      >
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-sidebar-accent text-sidebar-primary font-semibold has-left-bar"
          (click)="closeSidebar()"
          [attr.title]="collapsed() ? item.label : null"
          class="group relative flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-sidebar-foreground/80 transition-colors hover:bg-sidebar-accent/60 hover:text-sidebar-foreground active:scale-[0.99]"
          [ngClass]="{ 'lg:justify-center': collapsed() }"
        >
          <span
            class="absolute left-0 top-1/2 h-6 w-0.5 -translate-y-1/2 rounded-r bg-primary opacity-0 transition-opacity group-[.has-left-bar]:opacity-100"
          ></span>
          <ng-icon [name]="item.icon" size="1.4rem" class="shrink-0" />
          <span [ngClass]="{ 'lg:hidden': collapsed() }">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Account footer menu -->
    @if (currentUser) {
      <div class="shrink-0 border-t border-sidebar-border p-3">
        <button
          type="button"
          z-dropdown
          [zDropdownMenu]="accountMenu"
          zTrigger="click"
          class="group flex w-full items-center gap-3 rounded-md px-2 py-2 text-left transition-colors hover:bg-sidebar-accent/60 active:scale-[0.99]"
          [ngClass]="{ 'lg:justify-center lg:px-0': collapsed() }"
          aria-label="Open account menu"
        >
          <span
            class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-primary/12 text-sm font-semibold text-primary ring-1 ring-inset ring-primary/20"
            >{{ userInitials }}</span
          >
          <span class="min-w-0 flex-1 leading-tight" [ngClass]="{ 'lg:hidden': collapsed() }">
            <span class="block truncate text-sm font-medium">{{ currentUser.username }}</span>
            <span class="block truncate text-xs text-muted-foreground"
              >{{ currentUser.role }} · {{ currentUser.site }}</span
            >
          </span>
          <span class="shrink-0" [ngClass]="{ 'lg:hidden': collapsed() }">
            <ng-icon name="lucideChevronsUpDown" class="h-4 w-4 text-muted-foreground" />
          </span>
        </button>

        <z-dropdown-menu-content #accountMenu zSide="top" zAlign="start" class="w-(--z-dropdown-menu-trigger-width) min-w-52">
          <div class="px-2 py-1.5">
            <p class="truncate text-sm font-medium">{{ currentUser.username }}</p>
            <p class="truncate text-xs text-muted-foreground">{{ currentUser.role }} · {{ currentUser.site }}</p>
          </div>
          <div z-dropdown-menu-separator></div>
          <button z-dropdown-menu-item (click)="toggleDarkMode()">
            @if (isDarkMode()) {
              <ng-icon name="lucideSun" class="h-4 w-4" />
              <span>Light mode</span>
            } @else {
              <ng-icon name="lucideMoon" class="h-4 w-4" />
              <span>Dark mode</span>
            }
          </button>
          @if (showResetData) {
            <button z-dropdown-menu-item (click)="resetDemoData()">
              <ng-icon name="lucideDatabase" class="h-4 w-4" />
              <span>Reset demo data</span>
            </button>
          }
          <div z-dropdown-menu-separator></div>
          <button z-dropdown-menu-item (click)="logout()" class="text-destructive focus:text-destructive">
            <ng-icon name="lucideLogOut" class="h-4 w-4" />
            <span>Log out</span>
          </button>
        </z-dropdown-menu-content>
      </div>
    }
  </aside>

  <!-- Mobile backdrop -->
  @if (isSidebarOpen()) {
    <div class="fixed inset-0 z-20 bg-black/50 lg:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Main content -->
  <div class="flex min-h-0 flex-1 flex-col overflow-hidden">
    <header
      class="sticky top-0 z-20 flex h-14 items-center justify-between border-b border-border bg-background/80 px-4 backdrop-blur-md sm:px-6"
    >
      <div class="flex items-center gap-2 sm:gap-3">
        <button z-button zType="ghost" zSize="sm" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <ng-icon name="lucideMenu" class="h-5 w-5" />
        </button>
        <h1 class="truncate text-base font-semibold tracking-tight">{{ pageTitle() }}</h1>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        @if (currentUser) {
          <z-badge zType="secondary" class="hidden items-center gap-1 sm:inline-flex">{{
            currentUser.site
          }}</z-badge>
        }

        <button z-button zType="ghost" zSize="sm" (click)="toggleDarkMode()" aria-label="Toggle dark mode">
          @if (isDarkMode()) {
            <ng-icon name="lucideSun" class="h-5 w-5" />
          } @else {
            <ng-icon name="lucideMoon" class="h-5 w-5" />
          }
        </button>
      </div>
    </header>

    <main class="min-h-0 flex-1 overflow-auto">
      <div class="mx-auto max-w-screen-2xl px-4 pt-4 pb-8 sm:px-6">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
